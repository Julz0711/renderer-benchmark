name: API probe

on:
  push:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew printClasspath genSources --stacktrace
      - run: python3 probe.py > probe-out.txt 2>&1; wc -l probe-out.txt
      - run: cat probe-out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: |
            probe-out.txt
            sources/
